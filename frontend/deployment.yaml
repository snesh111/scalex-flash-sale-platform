apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: snesh111/frontend:v20   # ✅ CHANGE THIS
          imagePullPolicy: Always        # ✅ ADD THIS
          ports:
            - containerPort: 80