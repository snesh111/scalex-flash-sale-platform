apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: snesh111/api-gateway
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort   # 🔥 ONLY THIS IS EXPOSED
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30007